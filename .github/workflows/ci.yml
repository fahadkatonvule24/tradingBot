name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Test (no MetaTrader terminal needed; the MT5 adapter is tested against a fake module)
        run: pytest --cov=tradebot --cov-report=term-missing
      - name: Smoke-test backtest and walk-forward CLI on synthetic data
        run: |
          python scripts/make_demo_data.py --out demo-data
          tradebot backtest --data demo-data --timeframe M15 --symbols EURUSD GBPUSD -o out
          tradebot optimize --data demo-data --timeframe M15 --symbols EURUSD --strategy breakout --folds 2 --jobs 2 -o out
